name: Windows desktop rendering
on:
  push:
    branches: [codex/visual-polish-v03]
    paths:
      - 'tools/qa/windows_render_probe.py'
      - '.github/workflows/windows-render.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Published candidate tag
        default: v0.3.0-rc.1
        required: true
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || 'v0.3.0-rc.1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch released Windows ZIP and its GitHub digest
        shell: bash
        run: |
          gh release download "$TAG" --pattern '*-windows-x86_64.zip' --dir package
          digest=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | endswith("-windows-x86_64.zip")) | .digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ARCHIVE_SHA256=${digest#sha256:}" >> "$GITHUB_ENV"
      - name: Provision software graphics fallbacks
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc 'pacman --noconfirm --needed -S mingw-w64-x86_64-mesa'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'MESA_BIN=C:\msys64\mingw64\bin' >> $env:GITHUB_ENV
      - name: Install screenshot verification dependency
        run: python -m pip install Pillow
      - name: Exercise native title and encounter
        shell: bash
        run: python tools/qa/windows_render_probe.py package/*.zip windows-render --sha256 "$ARCHIVE_SHA256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-render-${{ matrix.os }}
          path: windows-render
